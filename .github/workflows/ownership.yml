name: Ownership

on:
  push:
    branches: [master, miyako-sleep-notification-ownership]
    paths:
      - '4D Plugin API/**'
      - '4DPlugin.cpp'
      - '4DPlugin.h'
      - '.github/tests/ownership*'
      - '.github/tests/test_ownership.py'
      - '.github/workflows/ownership.yml'
  pull_request:
    paths:
      - '4D Plugin API/**'
      - '4DPlugin.cpp'
      - '4DPlugin.h'
      - '.github/tests/ownership*'
      - '.github/tests/test_ownership.py'
      - '.github/workflows/ownership.yml'

permissions:
  contents: read

jobs:
  synthetic-ownership:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unsigned offline ASan and UBSan host
        run: python3 .github/tests/test_ownership.py -v
